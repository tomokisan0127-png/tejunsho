<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チェックシート編集</title>
<meta name="theme-color" content="#1a56b5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="チェックシート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* VOICE: 現場の道具。静かで確実、迷わせない
   IDEA: 白い紙のチェックシート。墨の文字、操作は藍、注意は朱
   COLOUR/TYPE: 白地・濃い墨文字・藍の操作色。指摘は 赤=要確認 / 黄=注意 / 青=提案。BIZ UDPゴシック
   LAYOUT: スマホ縦一列。上に戻る/元に戻す、下に固定の保存バー。押せる所は 48px 以上 */
:root{color-scheme:light;
--bg:#ffffff;--paper:#ffffff;--ink:#111418;--sub:#454b54;--line:#c5cad3;--tint:#f2f4f7;
--pri:#1a56b5;--pri-d:#123f86;--red:#c62828;--mark:#fff0a0;
--hi-bg:#fdecec;--hi-bd:#d93636;--hi-tx:#a51d1d;
--md-bg:#fff6d5;--md-bd:#d9a400;--md-tx:#7a5600;
--lo-bg:#e9f1fd;--lo-bd:#3f7ae0;--lo-tx:#1a4fa8;
--ok-bg:#e6f5ec;--ok-tx:#0b6b2f;
--shadow:0 1px 2px rgb(16 24 40/.06),0 1px 3px rgb(16 24 40/.08)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "BIZ UDPゴシック","BIZ UDPGothic","Meiryo UI","Hiragino Sans","Yu Gothic",sans-serif;overflow-x:clip;padding-bottom:92px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;min-height:48px;padding:0 16px;font-weight:700;color:var(--ink)}
button:hover:not(:disabled){background:var(--tint)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover:not(:disabled){background:var(--pri-d);border-color:var(--pri-d)}
button.ghost{border-color:transparent;background:transparent}
button.ic{width:48px;padding:0;display:grid;place-items:center}
button.sm{min-height:40px;padding:0 12px;font-size:14px}
button.danger{color:var(--red)}
[hidden]{display:none!important}
button:disabled{opacity:.4;cursor:default}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;padding:6px max(10px,env(safe-area-inset-left))}
header h1{font-size:18px;margin:0;flex:1;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .pg{font-size:13px;color:var(--sub);display:block;font-weight:400}
header #back{color:var(--pri);font-size:17px}
main{max-width:880px;margin:0 auto;padding:14px 12px}
.drop{background:var(--paper);border:2px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center}
.drop.on{border-color:var(--pri);background:var(--lo-bg)}
.drop h2{font-size:28px;line-height:1.2;margin:6px 0 10px;text-wrap:balance}
.drop p{color:var(--sub);margin:6px 0}
.sheetpic{display:block;margin:0 auto 14px;width:min(320px,100%)}
.note{font-size:14px;color:var(--sub);background:var(--tint);border-radius:10px;padding:10px 12px;margin-top:14px;text-align:left}
.search{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:0 14px;font-size:16px;margin-bottom:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow);flex-wrap:wrap}
.top .meta{display:block;margin:0;font-size:12px}.topb{display:flex;gap:8px;flex-wrap:wrap}
.top b{font-size:19px;font-variant-numeric:tabular-nums}
.db select,.ck select{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:var(--paper);font-size:16px}
.grp{margin:20px 0 6px;font-size:15px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between}
.grp span:last-child{color:var(--sub);font-weight:400;font-size:14px}
.list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);min-height:60px;width:100%;text-align:left;border-radius:0;border-left:0;border-right:0;border-bottom:0;background:none;font-weight:400}
.row:first-child{border-top:0}
.no{flex:none;min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.no small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.row .t{flex:1;font-size:16px}.row .t small{display:block;color:var(--sub);font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);flex:none}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--tint);padding:4px;border-radius:12px}
.tabs button{flex:1;border-color:transparent;background:transparent;min-height:46px;font-size:15px;padding:0 8px}
.tabs button[aria-pressed=true]{background:var(--paper);color:var(--pri);border-color:var(--line);box-shadow:var(--shadow)}
.meta{font-size:14px;color:var(--sub);margin:0 0 10px}
.items{display:grid;gap:8px}
.card{display:grid;grid-template-columns:40px 1fr;gap:4px 10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;width:100%;min-height:auto;font-weight:400;box-shadow:var(--shadow)}
.card.chg{background:linear-gradient(var(--mark),var(--mark)) left/6px 100% no-repeat,var(--paper)}
.card .n{grid-row:span 3;width:36px;height:36px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.card .n.sec{border-style:dashed;color:var(--sub)}
.card .proc{font-size:13px;font-weight:700;color:var(--pri)}
.card .it{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.card .std{font-size:14px;color:var(--sub);white-space:pre-wrap}
.card .memo{font-size:12px;color:var(--sub)}
.card .memo.today{color:var(--red);font-weight:700}
.add{width:100%;margin-top:10px;border-style:dashed;color:var(--pri)}
.gridwrap{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;max-height:70vh}
table.g{border-collapse:collapse;font-size:14px}
.g td,.g th{border:1px solid var(--line);padding:5px 7px;vertical-align:top;min-width:64px;max-width:240px;white-space:pre-wrap;overflow-wrap:anywhere}
.g th{position:sticky;top:0;background:var(--tint);font-weight:400;color:var(--sub);z-index:1}
.g th.rh{position:sticky;left:0;z-index:2;cursor:pointer;min-width:38px}
.g td{cursor:pointer}.g td:not(:empty){min-width:7.5em}.g td.f{color:var(--sub);background:var(--tint)}.g td.chg{background:var(--mark)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -2px 8px rgb(16 24 40/.06);display:flex;gap:10px;align-items:center;padding:10px max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.bar .cnt{flex:1;font-size:15px;color:var(--sub)}
.bar .cnt b{color:var(--red);font-size:21px}
.bar .pri{min-height:52px;padding:0 22px;font-size:17px}
dialog{border:0;border-radius:16px 16px 0 0;padding:0;width:100%;max-width:640px;margin:auto auto 0;background:var(--paper);color:var(--ink);max-height:92vh;box-shadow:0 -4px 24px rgb(0 0 0/.18)}
dialog::backdrop{background:rgb(17 20 24/.45)}
@media(min-width:700px){dialog{border-radius:16px;margin:auto}}
.dh{padding:16px 16px 6px;font-weight:700;font-size:19px}
.db{padding:4px 16px 8px;overflow:auto;max-height:68vh}
.df{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 16px;border-top:1px solid var(--line)}
.df .sp{flex:1}
@media(max-width:600px){.df .pri{flex:1 0 100%;order:9;min-height:52px}}
label.f{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px;font-weight:700}
.db textarea,.db input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);font-size:16px}
.db textarea{min-height:84px;resize:vertical}
.menu{display:grid;gap:8px}.menu button{text-align:left}
.rev{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0}
.rev b{font-size:14px}
.busy{position:fixed;inset:0;display:none;place-items:center;background:rgb(255 255 255/.7);z-index:20;color:var(--ink);font-weight:700;font-size:18px}
.busy.on{display:grid}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;box-shadow:0 4px 16px rgb(0 0 0/.2)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.hide{display:none!important}
/* ---- チェック画面 ---- */
.ck h3{font-size:17px;margin:20px 0 8px;display:flex;align-items:center}
.ck .stp{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;font-size:14px;margin-right:8px;flex:none}
.ck textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);font-size:14px}
.ck .row2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ck .row2 .pri{flex:1 1 220px}
.opt{display:flex;gap:10px;align-items:center;min-height:46px;padding:4px 0;cursor:pointer}
.opt input{width:22px;height:22px;flex:none;accent-color:var(--pri)}
.opt.dis{opacity:.45;cursor:default}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 12px;box-shadow:var(--shadow)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{display:block;border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--paper)}
.seg label:has(input:checked){border-color:var(--pri);background:var(--lo-bg)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg b{display:block;font-size:15px}.seg small{display:block;font-size:12px;color:var(--sub);line-height:1.4;margin-top:2px}
@media(max-width:520px){.seg{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{min-height:40px;border-radius:999px;font-size:14px;padding:0 14px}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.res{background:var(--paper);border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:10px 12px;margin:8px 0;box-shadow:var(--shadow)}
.res.hi{border-color:var(--hi-bd)}.res.md{border-color:var(--md-bd)}.res.lo{border-color:var(--lo-bd)}.res.ed{border-left-color:var(--ok-tx)}
.res label.h,.res .h{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;flex-wrap:wrap}
.res input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--pri)}
.res .lbl{font-size:12px;color:var(--sub);margin-top:8px;font-weight:700}
.res .df2{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.res .tgt{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--tint);border-radius:8px;padding:6px 8px;margin-top:6px}
.res .tgt small{color:var(--sub)}
.res .msg{font-size:15px;margin-top:6px;font-weight:700}
.res del{color:var(--hi-tx);text-decoration:line-through;background:var(--hi-bg)}.res ins{text-decoration:none;color:var(--ok-tx);background:var(--ok-bg);font-weight:700}
.res .note{font-size:14px;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--md-bg);color:var(--md-tx)}
.res .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.res .fix{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.res .fix label{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;color:var(--lo-tx);min-height:40px}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;line-height:1.6}
.badge.hi{background:var(--hi-bd);color:#fff}.badge.md{background:var(--md-bd);color:#111}.badge.lo{background:var(--lo-bd);color:#fff}.badge.ed{background:var(--ok-tx);color:#fff}
.badge.ty{background:var(--tint);color:var(--ink);border:1px solid var(--line)}
.badge.src{background:none;color:var(--sub);font-weight:400;border:1px solid var(--line)}
.wtag{color:var(--hi-tx);font-size:13px;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.sum div{border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700}
.sum b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.sum .hi{background:var(--hi-bg);color:var(--hi-tx)}.sum .md{background:var(--md-bg);color:var(--md-tx)}.sum .lo{background:var(--lo-bg);color:var(--lo-tx)}.sum .ed{background:var(--ok-bg);color:var(--ok-tx)}
.tagl{margin:6px 0;font-size:14px}.tagl b{display:inline-block;min-width:5em}
.stick{position:sticky;bottom:84px;z-index:3;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 2px 12px rgb(16 24 40/.12);margin-top:12px}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center}
.ckbtn{width:100%;margin:0 0 12px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--pri);border-color:var(--pri);background:var(--lo-bg);min-height:50px;font-size:16px}
.ckbtn:hover:not(:disabled){background:#dbe7fb}
.pvbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pvwrap{overflow:auto;background:#e6e9ee;border:1px solid var(--line);border-radius:12px;padding:8px;max-height:78vh;touch-action:pan-x pan-y pinch-zoom}
.pvpaper{background:#fff;box-shadow:0 1px 4px rgb(0 0 0/.25)}
table.pv{border-collapse:collapse;table-layout:fixed;font-family:"ＭＳ Ｐゴシック","MS PGothic","BIZ UDPゴシック","BIZ UDPGothic",sans-serif;color:#000;font-size:14.67px;line-height:1.2;background:#fff}
table.pv td{padding:0 2px;overflow:hidden;border:0}
table.pv td[style*="white-space:pre;"]{overflow:visible}
.pvwrap.mk tr.chg td{background-image:linear-gradient(rgb(255 214 0/.38),rgb(255 214 0/.38))}
.sug{margin-top:10px;background:#f7faff;border:1.5px solid var(--lo-bd);border-radius:12px;padding:8px 10px}
.sugh{font-weight:700;color:var(--lo-tx);font-size:15px;margin-bottom:4px}.sugh small{font-weight:400;margin-left:4px}
.fixc{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
.fixc.on{border-color:var(--pri);box-shadow:0 0 0 2px rgb(26 86 181/.18)}
.fixc .fl{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px;min-height:40px;cursor:pointer}
.fixc .fl small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.fixc input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--pri)}
.ftags{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.gtag{color:var(--md-tx);background:var(--md-bg);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.delx del{color:var(--hi-tx)}
.card.flash{outline:3px solid var(--pri);outline-offset:2px}
.err{color:var(--hi-tx);background:var(--hi-bg);border-radius:10px;padding:10px 12px;font-size:14px}
</style>
</head>
<body>
<header>
  <button class="ghost" id="back" aria-label="戻る" hidden>‹ 戻る</button>
  <h1 id="ttl">チェックシート編集</h1>
  <button class="ghost ic" id="undo" disabled aria-label="元に戻す" title="元に戻す"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="ghost ic" id="menuBtn" hidden aria-label="ページ操作" title="ページ操作"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></button>
</header>
<main id="main"></main>
<div class="bar hide" id="bar"><div class="cnt" id="cnt"></div><button class="pri" id="saveBtn">Excelに保存</button></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"><div class="dh" id="dlgH"></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></form></dialog>
<div class="busy" id="busy">処理中…</div>
<div class="toast" id="toast"></div>

<script>/* チェックシート編集エンジン: xlsx を XML レベルで直接編集し、書式・画像・数式を保つ */
(function (G) {
'use strict';
const NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const NS_PR = 'http://schemas.openxmlformats.org/package/2006/relationships';
const NS_XML = 'http://www.w3.org/XML/1998/namespace';
const T_SHEET = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet';
const CT_SHEET = 'application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml';

let DP = G.DOMParser, XS = G.XMLSerializer;
function setXml(dp, xs) { DP = dp; XS = xs; }
const parse = s => new DP().parseFromString(s, 'application/xml');
const ser = d => new XS().serializeToString(d);

/* ---------- 小物 ---------- */
const ln = e => e.localName || (e.nodeName || '').replace(/^.*:/, '');
function kids(el, name) { const o = []; if (!el) return o; for (let n = el.firstChild; n; n = n.nextSibling) if (n.nodeType === 1 && (!name || ln(n) === name)) o.push(n); return o; }
const kid = (el, name) => kids(el, name)[0] || null;
function all(root, name) { const o = []; const els = root.getElementsByTagName('*'); for (let i = 0; i < els.length; i++) if (ln(els[i]) === name) o.push(els[i]); return o; }
function mk(doc, local) { const r = doc.documentElement; return doc.createElementNS(r.namespaceURI, (r.prefix ? r.prefix + ':' : '') + local); }
function txt(el) { return el ? (el.textContent || '') : ''; }
function colNum(s) { let n = 0; for (const ch of s.toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64; return n; }
function colStr(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; }
function pRef(ref) { const m = /^\$?([A-Z]{1,3})\$?(\d+)$/.exec(ref); return m ? { c: colNum(m[1]), r: +m[2] } : null; }
const aRef = (r, c) => colStr(c) + r;
function pRange(s) { const [a, b] = s.split(':'); const p = pRef(a), q = b ? pRef(b) : p; return p && q ? { r1: p.r, c1: p.c, r2: q.r, c2: q.c } : null; }
const aRange = g => g.r1 === g.r2 && g.c1 === g.c2 ? aRef(g.r1, g.c1) : aRef(g.r1, g.c1) + ':' + aRef(g.r2, g.c2);
function relPath(base, target) { // base: 'xl/worksheets/sheet1.xml', target '../drawings/drawing1.xml'
  if (target.startsWith('/')) return target.slice(1);
  const parts = base.split('/'); parts.pop();
  for (const t of target.split('/')) { if (t === '..') parts.pop(); else if (t !== '.') parts.push(t); }
  return parts.join('/');
}
const relsOf = p => { const a = p.split('/'); const f = a.pop(); return a.join('/') + '/_rels/' + f + '.rels'; };
const norm = s => String(s == null ? '' : s).normalize('NFKC').replace(/\s+/g, '');
function serial(d) { return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 864e5); }
function fromSerial(n) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 864e5); return d.getUTCFullYear() + '/' + (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }
const dotDate = d => d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate();

/* ---------- 数式の参照書き換え ---------- */

function gridHtml(p) {

  if (sh.memoCol && sh.memoCol > maxC && sh.memoCol <= maxC + 6) maxC = sh.memoCol;
  maxC = Math.min(maxC, 40); const endR = Math.min(p.end, lastR + 2);
  const cover = new Set(), span = {};
  for (const m of b.merges(sh)) { const g = m.g; if (!g || g.r2 < p.start || g.r1 > endR) continue; span[g.r1 + ':' + g.c1] = g; for (let r = g.r1; r <= g.r2; r++) for (let c = g.c1; c <= g.c2; c++) if (r !== g.r1 || c !== g.c1) cover.add(r + ':' + c); }
  let h = `<div class="gridwrap"><table class="g"><thead><tr><th class="rh"></th>${Array.from({ length: maxC }, (_, i) => `<th>${XLS.util.colStr(i + 1)}</th>`).join('')}</tr></thead><tbody>`;
  for (let r = p.start; r <= endR; r++) {
    h += `<tr><th class="rh" data-r="${r}">${r}</th>`;
    for (let c = 1; c <= maxC; c++) {

    }

}

function diffHtml(a, b) {
  a = a || ''; b = b || ''; if (a === b) return esc(a);
  if (a.length * b.length > 250000) return `<del>${esc(a)}</del><ins>${esc(b)}</ins>`;
  const n = a.length, m = b.length, L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = '', mode = '', buf = '';
  const push = (md, ch) => { if (md !== mode) { if (buf) out += mode === 'd' ? `<del>${esc(buf)}</del>` : mode === 'i' ? `<ins>${esc(buf)}</ins>` : esc(buf); buf = ''; mode = md; } buf += ch; };
  while (i < n && j < m) { if (a[i] === b[j]) { push('', a[i]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) { push('d', a[i]); i++; } else { push('i', b[j]); j++; } }
  while (i < n) push('d', a[i++]); while (j < m) push('i', b[j++]); push('x', '');
  return out;
}

  if (a === b) return 1; if (a.length < 2 || b.length < 2) return 0;
  const m = new Map(); for (let i = 0; i < a.length - 1; i++) { const g = a.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); }

  const ents = revEntries(); const R = S.cb.revisionInfo(); const dc = S.cb.docCell();
  const body = (dc ? `<div class="rev"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="doc" checked style="width:22px;height:22px"> 文書番号を更新する（今：${esc(dc.value)}）</label>${fld('新しい文書番号（全ページのヘッダーに反映）', 'docno', XLS.CheckBook.nextDocNo(dc.value), false)}</div>` : '') + (R ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="rev" checked style="width:22px;height:22px"> 改訂履歴に追記する（サブNo. ${esc(R.nextSub)}）</label>` + fld('作成者', 'author', store.get('author'), false) + ents.map((e, i) => `<div class="rev"><b>${esc(e.proc)}</b>　<span class="meta">${esc(e.page)}</span>${fld('変更理由', 'reason' + i, '', false)}${fld('変更内容', 'content' + i, e.content, false)}</div>`).join('') : '<p class="meta">「改訂履歴」シートが見つからないため、履歴の追記はしません。</p>') + fld('ファイル名', 'fname', `${S.fileName}_${today.replace(/\./g, '')}.xlsx`.replace(/_(\d{8})_(\d{8})\.xlsx$/, '_$2.xlsx'), false);
  const r = await modal({ title: 'Excelに保存', body, buttons: ['|', { label: 'やめる', value: null }, { label: '保存する', value: 'ok', cls: 'pri' }] });
  if (r.v !== 'ok') return;
  const d = r.data; if (d.author != null) store.set('author', d.author);
  busy(true); await tick();
  try {
    await rebuild(); // 保存のたびに元ファイルから作り直す（改訂履歴が二重にならないように）
    if (dc && d.doc && d.docno && d.docno.trim()) S.cb.setDocNo(d.docno.trim());
    S.cb.recountTotals();
    if (R && d.rev) S.cb.addRevision(ents.map((e, i) => ({ proc: e.proc, page: e.page, reason: d['reason' + i] || '', content: d['content' + i] || e.content })), d.author);
    S.cb.refreshCache();
    const bytes = await S.bk.save();
    let name = (d.fname || 'チェックシート.xlsx').trim(); if (!/\.xlsx$/i.test(name)) name += '.xlsx';
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    await rebuild();
    busy(false);
    await deliver(blob, name);
  } catch (e) { busy(false); console.error(e); toast('保存できませんでした：' + e.message); }
}
let DL = null;
async function deliver(blob, name) {
  if (DL) {
    try { await DL.save({ filename: name, data: blob }); toast('保存しました'); return; }
    catch (e) { if (e && e.code === 'declined') { toast('保存をやめました'); return; } if (e && e.code === 'host_unavailable') { toast('このアプリでは保存できません。ブラウザかPCで開いてください'); return; } }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000); toast('保存しました（ダウンロード）');
}

/* ---------- 起動 ---------- */
$('#back').onclick = () => { if (S.view === 'page' && S.backTo === 'ai' && S.ai) { S.backTo = null; S.view = 'ai'; render(); return; } S.view = S.view === 'ai' && S.ai && S.ai.from ? 'page' : 'home'; if (S.view === 'page') S.pageKey = S.ai.from; render(); };
$('#undo').onclick = undo;
$('#menuBtn').onclick = () => pageMenu();
$('#saveBtn').onclick = save;
window.addEventListener('beforeunload', e => { if (S.ops.length) { e.preventDefault(); e.returnValue = ''; } });
renderStart();
if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { DL = d; }).catch(() => { });
}
</script>
